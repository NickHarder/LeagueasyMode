<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LeagueasyMode's app icon: a scope over a minimap, on macOS's icon grid (an 824-point body
       on a 1024 canvas). An original drawing; no game's artwork. Rendered to AppIcon.png by
       overlay/macos/scripts/render_icon.py, which build_app.sh turns into AppIcon.icns. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3557"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CF5E8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#2FD4C4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2FD4C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D27A"/>
      <stop offset="1" stop-color="#C8902E"/>
    </linearGradient>
    <clipPath id="inside">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>

  <!-- A minimap's lanes and river, faint behind the scope. -->
  <g clip-path="url(#inside)" fill="none" stroke-linecap="round">
    <path d="M230 800 L230 260 Q230 230 260 230 L790 230" stroke="#9FB6D6" stroke-opacity="0.11" stroke-width="26"/>
    <path d="M230 794 L764 794 Q794 794 794 764 L794 230" stroke="#9FB6D6" stroke-opacity="0.11" stroke-width="26"/>
    <path d="M250 774 L774 250" stroke="#9FB6D6" stroke-opacity="0.11" stroke-width="26"/>
    <path d="M300 400 Q420 470 470 560 Q520 650 640 710" stroke="#2FD4C4" stroke-opacity="0.22" stroke-width="34"/>
  </g>

  <!-- The scope. -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="url(#gold)" stroke-width="36"/>
  <g stroke="#E2B252" stroke-width="30" stroke-linecap="round">
    <line x1="512" y1="214" x2="512" y2="330"/>
    <line x1="512" y1="694" x2="512" y2="810"/>
    <line x1="214" y1="512" x2="330" y2="512"/>
    <line x1="694" y1="512" x2="810" y2="512"/>
  </g>

  <!-- What the scoreboard hides, found. -->
  <circle cx="512" cy="512" r="120" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="40" fill="#E9FFFC"/>
</svg>
