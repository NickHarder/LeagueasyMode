[project]
name = "leagueasymode"
version = "0.1.0"
description = "A macOS overlay for League of Legends that infers what the scoreboard hides, from the game\u0027s local APIs only."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.15",
]

# Local tooling; `uv sync` installs it, and it is not part of the package's metadata.
[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leagueasymode"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtins shadowing
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "D",                # pydocstyle (Google convention below)
  "ANN",              # annotations
  "PTH",              # pathlib
  "T20",              # no print in library code
  "S",                # bandit
  "PL",               # pylint subset (includes PLW2901 and PLR1704: no overwriting a loop variable or an argument)
  "PGH",              # a suppression names its rule: no blanket `# noqa` or `# type: ignore`
  "ASYNC",
  "ERA",              # no commented-out code
]
ignore = [
  "D203", "D213",     # Google style: blank line before class docstring off, summary on first line
  "PLR0913",          # many arguments are fine when each is named
  "PLR2004",          # magic numbers in validators are documented inline
  "S101",             # asserts allowed in tests (also excluded per-file below)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
