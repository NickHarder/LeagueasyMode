[project]
name = "leagueasymode"
version = "1.0.0"
description = "[DEPRECATED] A zero-latency tactical telemetry dashboard because macOS hates gamers and I can't track Cannon waves in my head."
authors = [{ name = "Nick Harder", email = "getcarried@localhost" }]
keywords = [
    "league-of-legends",
    "telemetry",
    "macOS-survivor",
    "dashboard",
    "deprecated",
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "flask>=3.1.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = ["mypy>=2.3.0", "ruff>=0.16.0", "types-pyyaml>=6.0.12.20260724"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
