<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeagueasyMode overlay</title>
    <link rel="stylesheet" href="/overlay.css">
    <script type="module" src="/overlay.js"></script>
  </head>
  <body>
    <div id="objective-strip" class="strip">
      <section id="dragon-widget" class="widget" hidden>
        <span id="dragon-icon" class="widget-icon" aria-hidden="true"></span>
        <span class="widget-text">
          <span class="widget-headline">
            <span id="dragon-label" class="widget-label">Dragon</span>
            <span id="dragon-time" class="widget-time"></span>
          </span>
          <span id="dragon-detail" class="widget-detail"></span>
        </span>
      </section>
      <div id="objective-pills" class="pill-row"></div>
    </div>
    <div id="callouts" class="callouts" aria-live="polite"></div>
    <aside id="enemy-strip" class="enemy-strip" hidden></aside>
    <aside id="you-panel" class="you-panel" hidden></aside>
    <div id="minimap" class="minimap" hidden></div>
  </body>
</html>
