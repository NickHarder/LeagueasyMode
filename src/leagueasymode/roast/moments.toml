# The moments about friends (phase 11.6): one line for each kind, its slots in braces.
#
# The owner approved these on 2026-10-28 ("approved"); a test holds them to a fingerprint, so a
# new or reworded line goes back to the owner first. Each states only facts a
# friend can check on the scoreboard or in the kill feed; the creep score is "at least" since the
# scoreboard may show an enemy's creep score only while they are in sight, so it can only lag.
# Slots: {friend} and {opponent} are champions; {count}, {kills}, {seconds} and {creep} numbers;
# {clock} a game clock such as 2:41 or 10:00; {monster} what the enemy took.

[lines]
solo_death = "{friend} has died to {opponent} alone {count} times now. Lane diff, live."
death_before_objective = "{friend} died {seconds} seconds before their {monster}. Very generous."
first_blood = "{friend} gave up first blood at {clock}. Setting the tone."
creep_behind = "{friend} is at least {creep} CS behind {opponent} at {clock}. The minions are winning."
opponent_streak = "{opponent} has killed {friend} {kills} times, and {friend} has no kills. Lane diff."
