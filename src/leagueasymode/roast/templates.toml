id = "damage-share-speedrun"
family = "damage"
subject = "defendant"
spice = [4, 4]
rank_by = "damage_share"
when = [{ slot = "damage_share", at_least = 0.28 }]
text = "{damage_share} of our dmg was me. rest of yall were cardboard cutouts"

# --- Objectives --------------------------------------------------------------------------------------

[[templates]]
