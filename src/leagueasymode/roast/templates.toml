# The roast's lines, approved word for word by the owner: first on 2026-10-08 in nothingsmyfault,
# where they were written, then rewritten here with more flair, each line with a punchline, and
# approved again on 2026-10-29, with harsher lines of its own for Speedrun
# (docs/plans/phase-11-roasts.md). A new or reworded line goes back
# to the owner.
#
# Every number in a line is a slot filled from an exhibit, so a template holds no digits and no
# number words of its own, and every template passes the safety floor (roast/safety.py): only
# gameplay is flamed, at every spice level.
#
#   subject       whose numbers the line is about: an ally of the defendant, an enemy, or the defendant
#   spice         the spice levels the line is offered at: 1 Honor-eligible, 2 Salty, 3 Tilted,
#                 4 Chat-Restricted Speedrun
#   rank_by       the slot whose value picks the subjects when several qualify (highest first)
#   when          the conditions the subject's exhibits must meet
#   verdicts      the verdicts the line is offered under (any, when left out)
#   max_subjects  how many qualifying subjects get the line (1 when left out)
#   narrow_only   offered only when the target is one lane or one player
#   text          the slots are listed in roast/compose.py
#
# The order is the order of the case: the closing line is the first that fits in chat.

# --- A win: the receipt ------------------------------------------------------------------------------

[[templates]]
id = "carry-receipt-score"
family = "carry"
subject = "defendant"
spice = [1, 2]
rank_by = "kills"
verdicts = ["carry_receipt"]
when = [{ slot = "kills", at_least = 5 }]
text = "Receipt: {kills}/{deaths}/{assists}. Tips appreciated."

[[templates]]
id = "carry-receipt-score-spicy"
family = "carry"
subject = "defendant"
spice = [3, 3]
rank_by = "kills"
